[project]
name = "findex"
version = "0.5.0"
description = "A small full-text search engine built lab by lab"
readme = "README.md"
authors = [
    { name = "erwrqq2", email = "jenyadaliduda@gmail.com" }
]
requires-python = ">=3.13"
keywords = ["search", "inverted-index", "bm25", "full-text"]
classifiers = [
    "Programming Language :: Python :: 3.13",
    "Environment :: Console",
    "Topic :: Text Processing :: Indexing",
    "Typing :: Typed",
]
dependencies = [
    "rich>=15.0.0",
    "typer>=0.29.1",
]

[project.scripts]
findex = "findex.cli:app"

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "hypothesis>=6.170.15",
    "matplotlib>=3.11.2",
    "psutil>=7.2.2",
    "pyright>=1.1.414",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.5",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers"]
markers = ["slow: takes more than a second (run everything with plain `pytest`, skip with -m 'not slow')"]

[tool.coverage.run]
source = ["findex"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.pyright]
include = ["src", "tests", "scripts"]
pythonVersion = "3.13"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"
