[project]
name = "findex"
version = "0.7.0"
description = "A small full-text search engine built lab by lab"
readme = "README.md"
authors = [
    { name = "erwrqq2", email = "jenyadaliduda@gmail.com" }
]
requires-python = ">=3.13"
keywords = ["search", "inverted-index", "bm25", "full-text"]
classifiers = [
    "Programming Language :: Python :: 3.13",
    "Environment :: Console",
    "Topic :: Text Processing :: Indexing",
    "Typing :: Typed",
]
dependencies = [
    "fastapi>=0.163.1",
    "fastembed>=0.9.1",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "numpy>=2.5.4",
    "pydantic-settings>=2.16.3",
    "rich>=15.0.0",
    "selectolax>=1.0.2",
    "typer>=0.29.1",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
findex = "findex.cli:app"

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "hypothesis>=6.170.15",
    "matplotlib>=3.11.2",
    "pillow>=13.0.0",
    "playwright>=1.65.2",
    "psutil>=7.2.2",
    "py-spy>=0.4.3",
    "pyright>=1.1.414",
    "pytest>=9.2.0",
    "pytest-benchmark>=5.3.1",
    "pytest-cov>=7.1.0",
    "pytest-github-actions-annotate-failures>=0.4.2",
    "ruff>=0.17.5",
    "scalene>=2.4.0",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "--benchmark-skip"]  # benchmarks: `pytest tests/test_benchmarks.py --benchmark-only`
markers = ["slow: takes more than a second (run everything with plain `pytest`, skip with -m 'not slow')"]

[tool.coverage.run]
source = ["findex"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.pyright]
include = ["src", "tests", "scripts"]
pythonVersion = "3.13"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"
